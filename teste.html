<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MGR API - Teste 2.4.3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #111827;
    }

    .card {
      max-width: 620px;
      margin: 0 auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
    }

    .subtitulo {
      color: #667085;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      border: 1px solid #c7cbd1;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 5px;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    #btnCriar {
      background: #111827;
      color: white;
    }

    #btnAtendimento {
      background: #1769e0;
      color: white;
      margin-top: 15px;
      display: none;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      margin-top: 25px;
      padding: 18px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      display: none;
    }

    .sucesso {
      border-left: 5px solid #16a34a;
    }

    .erro {
      border-left: 5px solid #dc2626;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      margin-bottom: 0;
    }

    .lead-info {
      margin-top: 18px;
      padding: 15px;
      background: #eef6ff;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Teste MGR — 2.4.3</h1>

    <div class="subtitulo">
      Lead → Cliente → Consultoria
    </div>

    <input
      id="nome"
      type="text"
      placeholder="Nome"
    >

    <input
      id="email"
      type="email"
      placeholder="E-mail"
    >

    <input
      id="whatsapp"
      type="text"
      placeholder="WhatsApp"
    >

    <button id="btnCriar">
      1. Criar Lead
    </button>

    <div id="leadInfo" class="lead-info"></div>

    <button id="btnAtendimento">
      2. Iniciar Atendimento
    </button>
    
    <button id="btnDiagnostico" disabled>
      3. Iniciar Diagnóstico
    </button>
    
    <div id="status" class="status">
      <pre id="resultado"></pre>
    </div>

  </div>


<script>

const API = "https://mgr-api.marceloprestes-economista.workers.dev";

let leadId = null;

const nome = document.getElementById("nome");
const email = document.getElementById("email");
const whatsapp = document.getElementById("whatsapp");

const btnCriar = document.getElementById("btnCriar");
const btnAtendimento = document.getElementById("btnAtendimento");

const leadInfo = document.getElementById("leadInfo");
const statusBox = document.getElementById("status");
const resultado = document.getElementById("resultado");


function mostrarResultado(data, sucesso = true) {

  statusBox.style.display = "block";

  statusBox.className =
    sucesso
      ? "status sucesso"
      : "status erro";

  resultado.textContent =
    JSON.stringify(data, null, 2);
}


btnCriar.addEventListener("click", async () => {

  if (!nome.value.trim()) {
    alert("Informe o nome.");
    return;
  }

  btnCriar.disabled = true;
  btnCriar.textContent = "Criando Lead...";

  try {

    const resposta = await fetch(
      API + "/leads",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          nome: nome.value.trim(),
          email: email.value.trim(),
          whatsapp: whatsapp.value.trim(),
          origem: "Teste MGR CRM",
          campanha: "Teste 2.4.3",
          observacoes: "Teste do fluxo Lead para Atendimento"
        })
      }
    );

    const data = await resposta.json();

    if (!resposta.ok || data.success === false) {
      throw new Error(
        data.message || "Erro ao criar Lead."
      );
    }

    leadId = data.data?.id;

    if (!leadId) {
      throw new Error(
        "Lead criado, mas a API não retornou o ID."
      );
    }

    leadInfo.style.display = "block";

    leadInfo.innerHTML =
      "<strong>Lead criado com sucesso.</strong><br>" +
      "ID: " + leadId + "<br>" +
      "Nome: " + (data.data?.nome || nome.value);

    btnAtendimento.style.display = "block";

    mostrarResultado(data, true);

  } catch (erro) {

    mostrarResultado({
      success: false,
      message: erro.message
    }, false);

  } finally {

    btnCriar.disabled = false;
    btnCriar.textContent = "1. Criar Lead";
  }

});


btnAtendimento.addEventListener("click", async () => {

  if (!leadId) {
    alert("Primeiro crie o Lead.");
    return;
  }

  btnAtendimento.disabled = true;
  btnAtendimento.textContent =
    "Iniciando Atendimento...";

  try {

    const resposta = await fetch(
      API + "/leads/" + leadId + "/iniciar-atendimento",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          tipo: "Diagnóstico MGR",
          status_lead: "Em atendimento",
          status_consultoria: "Em andamento"
        })
      }
    );

    const data = await resposta.json();

    if (!resposta.ok || data.success === false) {
      throw new Error(
        data.message || "Erro ao iniciar atendimento."
      );
    }
mostrarResultado(data, true);

// Guarda a consultoria criada
if (data.data && data.data.consultoria) {
    consultoriaId = data.data.consultoria.id;
}

// Habilita o botão 3
btnDiagnostico.disabled = false;
btnDiagnostico.removeAttribute("disabled");

} catch (erro) {
   
    mostrarResultado({
      success: false,
      message: erro.message
    }, false);

  } finally {

    btnAtendimento.disabled = false;
    btnAtendimento.textContent =
      "2. Iniciar Atendimento";
  }

});
  
btnDiagnostico.addEventListener("click", async () => {

  if (!consultoriaId) {
    mostrarResultado({
      success: false,
      message: "Consultoria não encontrada."
    }, false);
    return;
  }

  btnDiagnostico.disabled = true;
  btnDiagnostico.textContent = "Iniciando diagnóstico...";

  try {

    const resposta = await fetch(
      API + "/consultorias/" + consultoriaId + "/iniciar-diagnostico",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        }
      }
    );

    const data = await resposta.json();

    if (!resposta.ok || data.success === false) {
      throw new Error(
        data.message || "Erro ao iniciar diagnóstico."
      );
    }

    mostrarResultado(data, true);

  } catch (erro) {

    mostrarResultado({
      success: false,
      message: erro.message
    }, false);

  } finally {

    btnDiagnostico.disabled = false;
    btnDiagnostico.textContent =
      "3. Iniciar Diagnóstico";
  }

});
  
</script>

</body>
</html>
