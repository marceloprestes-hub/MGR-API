<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGR API - Teste Lead</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 40px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      cursor: pointer;
    }

    #resultado {
      margin-top: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>MGR API</h2>
    <p>Teste real de criação de Lead — 2.4.2</p>

    <input id="nome" placeholder="Nome">
    <input id="email" type="email" placeholder="E-mail">
    <input id="whatsapp" placeholder="WhatsApp">

    <button onclick="criarLead()">
      Criar Lead Teste
    </button>

    <div id="resultado"></div>

  </div>

  <script>
    const API = "https://mgr-api.marceloprestes-economista.workers.dev";

    async function criarLead() {

      const resultado = document.getElementById("resultado");

      const lead = {
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        whatsapp: document.getElementById("whatsapp").value,
        origem: "Teste MGR CRM",
        campanha: "Teste 2.4.2",
        status: "Novo",
        observacoes: "Lead criado pelo teste da API"
      };

      resultado.textContent = "Enviando...";

      try {

        const resposta = await fetch(API + "/leads", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(lead)
        });

        const dados = await resposta.json();

        resultado.textContent =
          JSON.stringify(dados, null, 2);

      } catch (erro) {

        resultado.textContent =
          "ERRO: " + erro.message;

      }
    }
  </script>

</body>
</html>
